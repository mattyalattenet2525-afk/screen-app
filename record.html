<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>録画設定</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .secondary {
            background: #f0f0f0;
            color: #333;
        }

        .secondary:hover {
            background: #e0e0e0;
        }

        .storage-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }

        .storage-info h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .storage-info p {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            display: block;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 録画設定</h1>

        <div class="storage-info">
            <h3>💾 保存先について</h3>
            <p>
                Chrome・Edgeなど対応ブラウザでは、USBメモリ、SDカード、外部SSD、内部ストレージから保存先を直接選択できます。<br>
                Firefox・Safari・iPhone・iPadなどでは、ブラウザのダウンロードまたは共有機能を使用します。
            </p>
        </div>

        <div class="form-group">
            <label for="storage">保存先</label>
            <select id="storage">
                <option value="default">デフォルト（ダウンロードフォルダ）</option>
                <option value="custom">カスタム（USB / SD / SSD など）</option>
            </select>
            <p class="help-text">
                カスタムを選択すると、録画開始時に保存先を選択するダイアログが表示されます（対応ブラウザのみ）。
            </p>
        </div>

        <div class="form-group">
            <label for="fps">フレームレート（FPS）</label>
            <select id="fps">
                <option value="30">30 FPS（標準）</option>
                <option value="60">60 FPS（高品質）</option>
                <option value="120">120 FPS（超高品質）</option>
            </select>
            <p class="help-text">
                高いFPSほど滑らかになりますが、ファイルサイズが大きくなります。
            </p>
        </div>

        <div class="form-group">
            <label for="resolution">解像度</label>
            <select id="resolution">
                <option value="1280x720">720p（HD）</option>
                <option value="1920x1080">1080p（フルHD）</option>
                <option value="2560x1440">1440p（2K）</option>
                <option value="3840x2160">2160p（4K）</option>
            </select>
            <p class="help-text">
                高い解像度ほど鮮明になりますが、ファイルサイズが大きくなります。
            </p>
        </div>

        <div class="form-group">
            <label for="audio">音声ソース</label>
            <select id="audio">
                <option value="system">システム音声（PC の音）</option>
                <option value="mic">マイク（自分の声）</option>
                <option value="both">両方</option>
                <option value="none">なし（無音）</option>
            </select>
            <p class="help-text">
                システム音声はPCの音、マイクは自分の声を録音します。
            </p>
        </div>

        <div id="status" class="status"></div>

        <div class="button-group">
            <button type="button" class="secondary" id="backButton">
                ← 戻る
            </button>
            <button type="button" class="primary" id="startButton">
                録画開始
            </button>
        </div>
    </div>

    <script>
        const storageSelect = document.getElementById("storage");
        const fpsSelect = document.getElementById("fps");
        const resolutionSelect = document.getElementById("resolution");
        const audioSelect = document.getElementById("audio");
        const statusDiv = document.getElementById("status");
        const backButton = document.getElementById("backButton");
        const startButton = document.getElementById("startButton");

        let directoryHandle = null;
        let customStorageSelected = false;

        function showStatus(message, type = "info") {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        async function selectCustomStorage() {
            if (typeof window.showDirectoryPicker !== "function") {
                showStatus(
                    "お使いのブラウザはカスタム保存先に対応していません。デフォルト保存を使用します。",
                    "error"
                );

                storageSelect.value = "default";
                customStorageSelected = false;

                return null;
            }

            try {
                const handle = await window.showDirectoryPicker({
                    mode: "readwrite"
                });

                const permission = await handle.queryPermission({
                    mode: "readwrite"
                });

                if (permission !== "granted") {
                    const requestPermission = await handle.requestPermission({
                        mode: "readwrite"
                    });

                    if (requestPermission !== "granted") {
                        showStatus(
                            "保存先のアクセス許可が得られませんでした。デフォルト保存を使用します。",
                            "error"
                        );

                        storageSelect.value = "default";
                        customStorageSelected = false;

                        return null;
                    }
                }

                directoryHandle = handle;
                customStorageSelected = true;

                showStatus(
                    `✅ 保存先を選択しました：${handle.name}`,
                    "success"
                );

                return handle;

            } catch (error) {
                console.error("保存先選択エラー:", error);

                if (error.name === "AbortError") {
                    showStatus(
                        "保存先の選択をキャンセルしました。デフォルト保存を使用します。",
                        "info"
                    );
                } else {
                    showStatus(
                        `保存先の選択に失敗しました：${error.message}`,
                        "error"
                    );
                }

                storageSelect.value = "default";
                customStorageSelected = false;

                return null;
            }
        }

        storageSelect.addEventListener("change", async () => {
            if (storageSelect.value === "custom") {
                await selectCustomStorage();
            } else {
                directoryHandle = null;
                customStorageSelected = false;
                showStatus("", "info");
            }
        });

        backButton.addEventListener("click", () => {
            window.location.href = "index.html";
        });

        startButton.addEventListener("click", async () => {
            const fps = parseInt(fpsSelect.value);
            const resolution = resolutionSelect.value;
            const audioSource = audioSelect.value;

            const settings = {
                fps,
                resolution,
                audioSource,
                useCustomStorage: customStorageSelected,
                directoryHandle: directoryHandle
            };

            sessionStorage.setItem("recorderSettings", JSON.stringify(settings));

            window.location.href = "record.html";
        });

        (async () => {
            const isFileSystemAccessSupported =
                typeof window.showDirectoryPicker === "function";

            if (!isFileSystemAccessSupported) {
                storageSelect.value = "default";
                storageSelect.disabled = true;

                const customOption = storageSelect.querySelector(
                    'option[value="custom"]'
                );

                if (customOption) {
                    customOption.textContent =
                        "カスタム（非対応ブラウザ）";
                    customOption.disabled = true;
                }

                showStatus(
                    "お使いのブラウザはカスタム保存先に対応していません。デフォルト保存を使用します。",
                    "info"
                );
            }
        })();
    </script>
</body>
</html>
