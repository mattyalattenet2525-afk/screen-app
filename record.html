<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画面録画 - 録画中</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    background: url("IMG_0312.jpeg") center / cover no-repeat;
}
.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}
h1 { margin: 0; font-size: 1.6rem; }
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
#logout { width: auto; margin: 0; padding: 10px 18px; background: #64748b; }
#logout:hover { background: #475569; }
.layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
}
.preview-area {
    min-height: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
}
video {
    width: 100%;
    max-height: 650px;
    background: black;
}
.no-preview {
    padding: 20px;
    color: #94a3b8;
    text-align: center;
}
.controls {
    padding: 20px;
    background: rgba(30, 41, 59, 0.85);
    border-radius: 10px;
}
.controls h2 { margin-top: 0; }
.status {
    padding: 12px;
    margin-bottom: 15px;
    text-align: center;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 7px;
}
.recording { color: #f87171; font-weight: bold; }
.settings-display {
    margin-bottom: 15px;
    padding: 12px;
    background: rgba(15, 23, 42, 0.7);
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.7;
}
#start { background: #3b82f6; }
#start:hover:not(:disabled) { background: #2563eb; }
#stop { background: #ef4444; }
#stop:hover:not(:disabled) { background: #dc2626; }
#merge { background: #8b5cf6; }
#merge:hover:not(:disabled) { background: #7c3aed; }
#save { background: #22c55e; }
#save:hover:not(:disabled) { background: #16a34a; }
#back { background: #64748b; }
#back:hover { background: #475569; }
.info {
    margin-top: 20px;
    color: #94a3b8;
    font-size: 0.85rem;
    line-height: 1.6;
}
@media (max-width: 800px) {
    body { padding: 15px; }
    .container { width: 100%; padding: 20px; }
    header { flex-direction: column; align-items: stretch; }
    #logout { width: 100%; }
    .layout { grid-template-columns: 1fr; }
    .preview-area { min-height: 300px; }
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎥 録画中</h1>
        <button id="logout">ログアウト</button>
    </header>
    <div class="layout">
        <section class="preview-area">
            <div id="no-preview" class="no-preview">ここに録画した映像が表示されます。</div>
            <video id="preview" class="hidden" controls></video>
        </section>
        <section class="controls">
            <h2>録画操作</h2>
            <div id="status" class="status">待機中</div>
            <div class="settings-display" id="settingsDisplay">設定読込中...</div>
            <button id="start">🎥 録画を開始</button>
            <button id="stop" disabled>⏹ 録画を停止</button>
            <button id="merge" disabled>📎 録画データを結合</button>
            <button id="save" disabled>💾 保存</button>
            <button id="back">🔙 操作画面へ戻る</button>
            <p class="info">
                録画データは 1 分 30 秒ごとに分割され、クラウドへ送信されます。
            </p>
        </section>
    </div>
</div>
<script>
if (sessionStorage.getItem("recording_authenticated") !== "true") {
    window.location.href = "index.html";
}

const start = document.getElementById("start");
const stop = document.getElementById("stop");
const merge = document.getElementById("merge");
const save = document.getElementById("save");
const back = document.getElementById("back");
const logout = document.getElementById("logout");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const noPreview = document.getElementById("no-preview");
const settingsDisplay = document.getElementById("settingsDisplay");

const fps = sessionStorage.getItem("selected_fps") || "30";
const resolution = sessionStorage.getItem("selected_resolution") || "1280x720";
const storage = sessionStorage.getItem("selected_storage") || "internal";
const cloudService = sessionStorage.getItem("selected_cloud") || "mega";
const cloudAccount = sessionStorage.getItem("cloud_account") || "";
const cloudPassword = sessionStorage.getItem("cloud_password") || "";
const cloudToken = sessionStorage.getItem("cloud_token") || "";
const externalStorageSelected = sessionStorage.getItem("external_storage_selected") === "true";

settingsDisplay.innerHTML = `
    <strong>現在の設定</strong><br>
    FPS: ${fps}FPS<br>
    解像度：${resolution}<br>
    保存先：${storage === "internal" ? "内部ストレージ" : (externalStorageSelected ? "外部ストレージ（選択済）" : "外部ストレージ（未選択）")}<br>
    クラウド：${cloudService}
`;

let stream = null;
let recorder = null;
let chunks = [];
let recordedBlob = null;
let chunkIndex = 0;
const CHUNK_INTERVAL_MS = 90000;
let sessionId = null;
let mergedBlob = null;

const [width, height] = resolution.split("x").map(Number);

function generateSessionId() {
    return "session-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8);
}

async function checkStorageSpace(requiredBytes) {
    if (!navigator.storage || !navigator.storage.estimate) return true;
    const estimate = await navigator.storage.estimate();
    const available = Math.max(0, (estimate.quota || 0) - (estimate.usage || 0));
    return available >= requiredBytes;
}

async function startRecording() {
    try {
        chunks = [];
        recordedBlob = null;
        chunkIndex = 0;
        sessionId = generateSessionId();
        mergedBlob = null;

        stream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "motion", frameRate: Number(fps) },
            audio: true
        });

        const videoTrack = stream.getVideoTracks()[0];
        try {
            await videoTrack.applyConstraints({
                frameRate: { ideal: Number(fps), max: Number(fps) },
                width: { ideal: width },
                height: { ideal: height }
            });
        } catch (e) {}

        let mimeType = "video/webm;codecs=vp9,opus";
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "video/webm";

        recorder = new MediaRecorder(stream, { mimeType });

        recorder.ondataavailable = async (event) => {
            if (event.data && event.data.size > 0) {
                chunks.push(event.data);
                const canSave = await checkStorageSpace(event.data.size);
                if (!canSave) {
                    status.textContent = "⚠️ 保存先の容量が不足しています";
                    stopRecording();
                    return;
                }
                await uploadChunk(event.data, chunkIndex++);
            }
        };

        recorder.onstop = () => {
            recordedBlob = new Blob(chunks, { type: "video/webm" });
            preview.src = URL.createObjectURL(recordedBlob);
            preview.classList.remove("hidden");
            noPreview.classList.add("hidden");
            status.textContent = "録画完了。結合ボタンを押してください。";
            status.classList.remove("recording");
            merge.disabled = false;
        };

        const videoTrackEnd = stream.getVideoTracks()[0];
        videoTrackEnd.addEventListener("ended", () => {
            if (recorder && recorder.state === "recording") {
                stopRecording();
            }
        });

        recorder.start(CHUNK_INTERVAL_MS);

        start.disabled = true;
        stop.disabled = false;
        merge.disabled = true;
        save.disabled = true;
        status.textContent = "🔴 録画中";
        status.classList.add("recording");
    } catch (error) {
        console.error(error);
        status.textContent = "録画を開始できませんでした。";
    }
}

function stopRecording() {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }
    if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
    }
    start.disabled = false;
    stop.disabled = true;
}

async function uploadChunk(blob, index) {
    try {
        const response = await fetch("/upload-chunk", {
            method: "POST",
            body: blob,
            headers: {
                "X-Session-Id": sessionId,
                "X-Chunk-Index": index.toString()
            }
        });
        if (response.status === 413) {
            status.textContent = "⚠️ クラウドストレージの容量制限に達しました";
            stopRecording();
            return;
        }
        if (!response.ok) {
            console.warn("Upload failed for chunk");
        }
    } catch (e) {
        console.error("Upload error:", e);
    }
}

async function mergeRecording() {
    if (!sessionId) return;
    merge.disabled = true;
    status.textContent = "結合中...";
    try {
        const response = await fetch("/merge-and-upload", {
            method: "POST",
            headers: {
                "X-Session-Id": sessionId,
                "X-Cloud-Service": cloudService,
                "X-Cloud-Account": cloudAccount,
                "X-Cloud-Password": cloudPassword,
                "X-Cloud-Token": cloudToken
            }
        });
        const result = await response.json();
        if (result.ok) {
            mergedBlob = recordedBlob;
            status.textContent = `結合完了：${result.filename} (${result.size} bytes)`;
            if (result.cloudUrl) {
                status.textContent += `
URL: ${result.cloudUrl}`;
            }
            save.disabled = false;
        } else {
            status.textContent = "結合に失敗しました";
        }
    } catch (e) {
        status.textContent = "エラー：" + e.message;
    }
}

async function saveRecording() {
    if (!mergedBlob) return;
    try {
        if (storage === "external" && window.showDirectoryPicker) {
            const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
            const filename = `rec-${Date.now()}.webm`;
            const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(mergedBlob);
            await writable.close();
            status.textContent = `保存完了：${dirHandle.name}/${filename}`;
        } else {
            const url = URL.createObjectURL(mergedBlob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `rec-${Date.now()}.webm`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            status.textContent = "保存完了（ダウンロード）";
        }
    } catch (e) {
        status.textContent = "保存エラー：" + e.message;
    }
}

function goBack() {
    if (recorder && recorder.state === "recording") {
        stopRecording();
    }
    window.location.href = "recorder.html";
}

function doLogout() {
    if (recorder && recorder.state === "recording") {
        stopRecording();
    }
    sessionStorage.removeItem("recording_authenticated");
    window.location.href = "index.html";
}

start.addEventListener("click", startRecording);
stop.addEventListener("click", stopRecording);
merge.addEventListener("click", mergeRecording);
save.addEventListener("click", saveRecording);
back.addEventListener("click", goBack);
logout.addEventListener("click", doLogout);
</script>
</body>
</html>
