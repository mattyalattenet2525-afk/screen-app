<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面録画アプリ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .features {
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .features h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .features ul {
            list-style: none;
            padding-left: 0;
        }

        .features li {
            color: #555;
            margin-bottom: 8px;
            padding-left: 24px;
            position: relative;
            font-size: 14px;
        }

        .features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #22c55e;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #fff3cd;
            border-left: 4px solid #f59e0b;
            border-radius: 0 8px 8px 0;
            text-align: left;
            font-size: 13px;
            color: #856404;
        }

        .note strong {
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎥</div>
        <h1>画面録画アプリ</h1>

        <p>
            ブラウザから直接画面を録画し、<br>
            USB・SDカード・外部SSDへ保存できます。
        </p>

        <div class="features">
            <h3>主な機能</h3>
            <ul>
                <li>クラウド不要・パスワード入力なし</li>
                <li>USB・SDカード・外部SSDへ直接保存</li>
                <li>FPS・解像度・音声をカスタマイズ</li>
                <li>Chrome・Edge・Firefox・Safari対応</li>
                <li>Android・iPhoneも端末最適化で録画</li>
            </ul>
        </div>

        <button id="startButton" type="button">
            録画を開始
        </button>

        <div class="note">
            <strong>📱 スマホ・タブレットの方</strong>
            一部の機種ではブラウザからの画面録画に対応していない場合があります。その場合は、端末標準の画面録画機能をご使用ください。
        </div>
    </div>

    <script>
        const startButton = document.getElementById("startButton");

        startButton.addEventListener("click", () => {
            window.location.href = "recorder.html";
        });
    </script>
</body>
</html>
