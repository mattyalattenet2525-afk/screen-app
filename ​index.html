<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画面録画ツール</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    padding: 20px;
    background: url("IMG_0312.jpeg") center / cover no-repeat;
}
.container {
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.95);
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
}
h1 { margin: 0 0 20px; font-size: 1.8rem; }
p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
#startBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: #3b82f6;
}
#startBtn:hover { background: #2563eb; }
.info {
    margin-top: 25px;
    padding: 15px;
    background: rgba(30, 41, 59, 0.6);
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #94a3b8;
    text-align: left;
}
</style>
</head>
<body>
<div class="container">
    <h1>🎥 画面録画ツール</h1>
    <p>あなたのクラウドストレージを使って画面を録画・保存します</p>
    <button id="startBtn">開始する</button>
    <div class="info">
        <strong>使い方</strong>：<br>
        1. クラウドサービスを選択<br>
        2. アカウント情報を入力<br>
        3. 録画設定（FPS、解像度）<br>
        4. 録画開始 → 自動でクラウドへ保存
    </div>
</div>
<script>
document.getElementById("startBtn").addEventListener("click", () => {
    sessionStorage.setItem("recording_authenticated", "true");
    window.location.href = "recorder.html";
});
</script>
</body>
</html>
