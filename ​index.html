```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画面録画ツール - ログイン</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    background: url("IMG_0031.jpeg") center / cover no-repeat;
}

.container {
    width: 90%;
    max-width: 900px;
    padding: 45px;
    text-align: center;
    background: rgba(15, 23, 42, 0.86);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

h1 {
    margin-top: 0;
    margin-bottom: 15px;
}

.description {
    color: #cbd5e1;
    margin-bottom: 30px;
}

.login-area {
    max-width: 550px;
    margin: auto;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    color: white;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 7px;
    outline: none;
}

input:focus {
    border-color: #3b82f6;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    background: #3b82f6;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

.error {
    min-height: 20px;
    color: #ef4444;
}

@media (max-width: 600px) {
    .container {
        width: 94%;
        padding: 25px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎥 画面録画ツール</h1>

    <p class="description">
        使用するにはパスワードを入力してください。
    </p>

    <div class="login-area">
        <input
            type="password"
            id="password"
            placeholder="パスワードを入力"
            autocomplete="off"
        >

        <button id="login">
            入室する
        </button>

        <p id="error" class="error"></p>
    </div>
</div>

<script>
const CORRECT_PASSWORD = "testpass";

const password = document.getElementById("password");
const login = document.getElementById("login");
const error = document.getElementById("error");

function loginCheck() {
    if (password.value === CORRECT_PASSWORD) {
        sessionStorage.setItem(
            "recording_authenticated",
            "true"
        );

        window.location.href = "recorder.html";
    } else {
        error.textContent = "パスワードが間違っています。";
        password.value = "";
        password.focus();
    }
}

login.addEventListener("click", loginCheck);

password.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        loginCheck();
    }
});
</script>

</body>
</html>
```
