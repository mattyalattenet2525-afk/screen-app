<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画面録画ツール - 設定</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%), url("IMG_0312.jpeg") center / cover;
}
.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}
h1 { margin: 0; font-size: 1.6rem; }
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}
button:hover { opacity: 0.92; }
#logout { width: auto; margin: 0; padding: 10px 18px; background: #64748b; }
#logout:hover { background: #475569; }
.layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
}
.preview-area {
    min-height: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
}
.preview-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.controls {
    padding: 20px;
    background: rgba(30, 41, 59, 0.85);
    border-radius: 10px;
}
.controls h2 { margin-top: 0; }
.status {
    padding: 12px;
    margin-bottom: 15px;
    text-align: center;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 7px;
}
.group { margin-top: 14px; }
.group label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 0.92rem;
}
.input-group {
    position: relative;
}
.input-group input {
    width: 100%;
    padding: 12px;
    padding-right: 50px;
    border: 1px solid #334155;
    border-radius: 7px;
    background: #0f172a;
    color: white;
    outline: none;
}
.input-group .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 1.2rem;
    width: auto;
    padding: 0;
    margin: 0;
}
.input-group .toggle-password:hover {
    color: #cbd5e1;
    opacity: 1;
}
select, input {
    width: 100%;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 7px;
    background: #0f172a;
    color: white;
    outline: none;
}
#to-record { background: #3b82f6; }
#to-record:hover { background: #2563eb; }
#select-storage { background: #0ea5e9; }
#select-storage:hover { background: #0284c7; }
.info {
    margin-top: 20px;
    color: #94a3b8;
    font-size: 0.85rem;
    line-height: 1.6;
}
.device-box {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.65);
}
.device-box h3 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: #e2e8f0;
}
.device-list {
    margin: 0;
    padding-left: 18px;
    color: #cbd5e1;
    line-height: 1.7;
    word-break: break-word;
}
.small-note {
    margin-top: 8px;
    color: #94a3b8;
    font-size: 0.8rem;
    line-height: 1.5;
}
@media (max-width: 800px) {
    body { padding: 15px; }
    .container { width: 100%; padding: 20px; }
    header { flex-direction: column; align-items: stretch; }
    #logout { width: 100%; }
    .layout { grid-template-columns: 1fr; }
    .preview-area { min-height: 240px; }
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎥 画面録画コントロールパネル</h1>
        <button id="logout">ログアウト</button>
    </header>
    <div class="layout">
        <section class="preview-area">
            <img class="preview-image" src="IMG_0312.jpeg" alt="操作画面イメージ" />
        </section>
        <section class="controls">
            <h2>操作項目</h2>
            <div id="status" class="status">設定を入力してください</div>
            
            <div class="group">
                <label for="cloudService">クラウドサービス</label>
                <select id="cloudService">
                    <option value="mega">MEGA</option>
                    <option value="gdrive">Google Drive</option>
                    <option value="dropbox">Dropbox</option>
                    <option value="local">ローカル保存</option>
                </select>
            </div>
            
            <div class="group">
                <label for="cloudAccount">アカウント名（メール）</label>
                <div class="input-group">
                    <input type="text" id="cloudAccount" placeholder="email@example.com" />
                </div>
            </div>
            
            <div class="group">
                <label for="cloudPassword">パスワード</label>
                <div class="input-group">
                    <input type="password" id="cloudPassword" placeholder="パスワード" />
                    <button type="button" class="toggle-password" onclick="togglePassword('cloudPassword')">👁</button>
                </div>
            </div>
            
            <div class="group">
                <label for="cloudToken">トークン（任意）</label>
                <div class="input-group">
                    <input type="text" id="cloudToken" placeholder="OAuth トークンなど" />
                    <button type="button" class="toggle-password" onclick="togglePassword('cloudToken')">👁</button>
                </div>
            </div>
            
            <div class="group">
                <label for="storageType">保存先</label>
                <select id="storageType">
                    <option value="internal">内部ストレージ</option>
                    <option value="external">外部ストレージ（USB、SD カード、SSD）</option>
                </select>
            </div>
            
            <button id="select-storage">📁 外部ストレージを選択</button>
            
            <div id="deviceBox" class="device-box">
                <h3>接続中の外部ストレージ</h3>
                <ul id="deviceList" class="device-list">
                    <li>「外部ストレージを選択」ボタンを押して選択してください</li>
                </ul>
                <div class="small-note">
                    File System Access API 対応ブラウザで外部ストレージを選択できます。
                </div>
            </div>
            
            <div class="group">
                <label for="fpsType">FPS</label>
                <select id="fpsType">
                    <option value="30">30FPS</option>
                    <option value="60">60FPS</option>
                </select>
            </div>
            
            <div class="group">
                <label for="resolutionType">解像度</label>
                <select id="resolutionType">
                    <option value="256x144">144p：256 × 144px</option>
                    <option value="427x240">240p：427 × 240px</option>
                    <option value="640x360">360p：640 × 360px</option>
                    <option value="720x480">480p（SD）：720 × 480px</option>
                    <option value="1280x720">720p（HD）：1280 × 720px</option>
                    <option value="1920x1080">1080p（フル HD）：1920 × 1080px</option>
                    <option value="2560x1440">1440p（WQHD）：2560 × 1440px</option>
                </select>
            </div>
            
            <button id="to-record">この設定で録画を開始する</button>
            
            <p class="info">
                クラウド認証情報は毎回入力します。<br>
                外部ストレージは File System Access API で選択します。
            </p>
        </section>
    </div>
</div>
<script>
if (sessionStorage.getItem("recording_authenticated") !== "true") {
    window.location.href = "index.html";
}

const logout = document.getElementById("logout");
const status = document.getElementById("status");
const toRecord = document.getElementById("to-record");
const storageType = document.getElementById("storageType");
const fpsType = document.getElementById("fpsType");
const resolutionType = document.getElementById("resolutionType");
const cloudService = document.getElementById("cloudService");
const cloudAccount = document.getElementById("cloudAccount");
const cloudPassword = document.getElementById("cloudPassword");
const cloudToken = document.getElementById("cloudToken");
const selectStorageBtn = document.getElementById("select-storage");
const deviceList = document.getElementById("deviceList");

let selectedDirectoryHandle = null;

function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}

function renderDevices(items) {
    deviceList.innerHTML = "";
    if (!items.length) {
        const li = document.createElement("li");
        li.textContent = "接続中の外部ストレージは検出できません。";
        deviceList.appendChild(li);
        return;
    }
    items.forEach((name) => {
        const li = document.createElement("li");
        li.textContent = name;
        deviceList.appendChild(li);
    });
}

async function selectExternalStorage() {
    try {
        if (!window.showDirectoryPicker) {
            alert("お使いのブラウザは File System Access API に対応していません。");
            return;
        }
        const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        selectedDirectoryHandle = dirHandle;
        renderDevices([`外部ストレージ：${dirHandle.name}`]);
        status.textContent = `外部ストレージ「${dirHandle.name}」を選択しました`;
    } catch (error) {
        if (error.name !== "AbortError") {
            alert("外部ストレージの選択に失敗しました：" + error.message);
        }
    }
}

selectStorageBtn.addEventListener("click", selectExternalStorage);

toRecord.addEventListener("click", () => {
    sessionStorage.setItem("recording_authenticated", "true");
    sessionStorage.setItem("selected_storage", storageType.value);
    sessionStorage.setItem("selected_fps", fpsType.value);
    sessionStorage.setItem("selected_resolution", resolutionType.value);
    sessionStorage.setItem("selected_cloud", cloudService.value);
    sessionStorage.setItem("cloud_account", cloudAccount.value);
    sessionStorage.setItem("cloud_password", cloudPassword.value);
    sessionStorage.setItem("cloud_token", cloudToken.value);
    
    if (storageType.value === "external" && selectedDirectoryHandle) {
        sessionStorage.setItem("external_storage_selected", "true");
    }
    
    window.location.href = "record.html";
});

logout.addEventListener("click", () => {
    sessionStorage.removeItem("recording_authenticated");
    window.location.href = "index.html";
});

renderDevices(["「外部ストレージを選択」ボタンを押して選択してください"]);
</script>
</body>
</html>
