```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画面録画ツール - 録画</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    background: url("IMG_0312.jpeg") center / cover no-repeat;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 1.6rem;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#logout {
    width: auto;
    margin: 0;
    padding: 10px 18px;
    background: #64748b;
}

#logout:hover {
    background: #475569;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
}

.preview-area {
    min-height: 450px;
    display: flex;

    align-items: center;

    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
}

video {
    width: 100%;
    max-height: 650px;
    background: black;
}

.no-preview {
    padding: 20px;
    color: #94a3b8;
    text-align: center;
}

.hidden {
    display: none;
}

.controls {
    padding: 20px;
    background: rgba(30, 41, 59, 0.85);

}

.controls h2 {
    margin-top: 0;
}

.status {
    padding: 12px;
    margin-bottom: 15px;
    text-align: center;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 7px;
}

.recording {
    color: #f87171;
    font-weight: bold;

    background: #3b82f6;
}

    background: #2563eb;
}

#stop {

    background: #22c55e;

#download:hover:not(:disabled) {
    background: #16a34a;

</head>

<body>

<div class="container">

<header>
    <h1>🎥 画面録画コントロールパネル</h1>
    <button id="logout">ログアウト</button>
</header>

<div class="layout">

<section class="preview-area">

    <div id="no-preview" class="no-preview">
        ここに録画した映像が表示されます。
    </div>

    <video id="preview" class="hidden" controls></video>

</section>

<section class="controls">

    <h2>録画操作</h2>

    <div id="status" class="status">
        待機中
    </div>

    <button id="start">
        🎥 画面録画を開始
    </button>

    <button id="stop" disabled>
        ⏹ 録画を停止
    </button>

    <button id="download" disabled>
        💾 録画を保存
    </button>

    <p class="info">
        「画面録画を開始」を押すと、
        録画する画面を選択できます。
        <br><br>
        「画面」「ウィンドウ」「ブラウザタブ」
        などから選択してください。
        <br><br>
        録画データはWebM形式で保存されます。
    </p>

</section>

</div>
</div>

<script>
if (
    sessionStorage.getItem("recording_authenticated") !== "true"
) {
    window.location.href = "index.html";
}

const start = document.getElementById("start");
const stop = document.getElementById("stop");
const download = document.getElementById("download");
const logout = document.getElementById("logout");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const noPreview = document.getElementById("no-preview");

let stream = null;
let recorder = null;
let chunks = [];
let recordedBlob = null;

async function startRecording() {
    try {
        chunks = [];
        recordedBlob = null;

        stream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "motion" },
            audio: true
        });

        let mimeType = "video/webm;codecs=vp9,opus";

        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = "video/webm";
        }

        recorder = new MediaRecorder(stream, {
            mimeType: mimeType
        });

        recorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        recorder.onstop = () => {
            recordedBlob = new Blob(chunks, {
                type: "video/webm"
            });

            preview.src = URL.createObjectURL(recordedBlob);
            preview.classList.remove("hidden");
            noPreview.classList.add("hidden");

            download.disabled = false;
            status.textContent = "録画完了";
            status.classList.remove("recording");
        };

        const videoTrack = stream.getVideoTracks()[0];

        videoTrack.addEventListener("ended", () => {
            if (
                recorder &&
                recorder.state === "recording"
            ) {
                stopRecording();
            }
        });

        recorder.start(1000);

        start.disabled = true;
        stop.disabled = false;
        download.disabled = true;

        status.textContent = "🔴 録画中";
        status.classList.add("recording");

    } catch (error) {
        console.error(error);
        status.textContent =
            "録画を開始できませんでした。";
    }
}

function stopRecording() {
    if (
        recorder &&
        recorder.state === "recording"
    ) {
        recorder.stop();
    }

    if (stream) {
        stream.getTracks().forEach((track) => {
            track.stop();
        });

        stream = null;
    }

    start.disabled = false;
    stop.disabled = true;
}

function downloadRecording() {
    if (!recordedBlob) {
        return;
    }

    const url = URL.createObjectURL(recordedBlob);
    const link = document.createElement("a");
    const now = new Date();

    const filename =
        "screen-recording-" +
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + "-" +
        String(now.getHours()).padStart(2, "0") + "-" +
        String(now.getMinutes()).padStart(2, "0") + "-" +
        String(now.getSeconds()).padStart(2, "0") +
        ".webm";

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 1000);
}

function doLogout() {
    if (
        recorder &&
        recorder.state === "recording"
    ) {
        stopRecording();
    }

    sessionStorage.removeItem(
        "recording_authenticated"
    );

    window.location.href = "index.html";
}

start.addEventListener("click", startRecording);
stop.addEventListener("click", stopRecording);
download.addEventListener("click", downloadRecording);
logout.addEventListener("click", doLogout);
</script>

</body>
</html>
