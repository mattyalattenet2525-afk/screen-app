<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画面録画ツール - 操作画面</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: white;
    background: url("IMG_0312.jpeg") center / cover no-repeat;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 1.6rem;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    opacity: 0.92;
}

#logout {
    width: auto;
    margin: 0;
    padding: 10px 18px;
    background: #64748b;
}

#logout:hover {
    background: #475569;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
}

.preview-area {
    min-height: 450px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
}

.preview-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.no-preview {
    padding: 20px;
    color: #94a3b8;
    text-align: center;
    line-height: 1.7;
}

.hidden {
    display: none;
}

.controls {
    padding: 20px;
    background: rgba(30, 41, 59, 0.85);
    border-radius: 10px;
}

.controls h2 {
    margin-top: 0;
}

.status {
    padding: 12px;
    margin-bottom: 15px;
    text-align: center;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 7px;
}

.group {
    margin-top: 14px;
}

.group label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 0.92rem;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 7px;
    background: #0f172a;
    color: white;
    outline: none;
}

#to-save {
    background: #0ea5e9;
}

#to-save:hover {
    background: #0284c7;
}

#to-record {
    background: #3b82f6;
}

#to-record:hover {
    background: #2563eb;
}

#start {
    background: #22c55e;
}

#start:hover {
    background: #16a34a;
}

#stop {
    background: #ef4444;
}

#stop:hover {
    background: #dc2626;
}

#download {
    background: #8b5cf6;
}

#download:hover {
    background: #7c3aed;
}

.info {
    margin-top: 20px;
    color: #94a3b8;
    font-size: 0.85rem;
    line-height: 1.6;
}

@media (max-width: 800px) {
    body {
        padding: 15px;
    }

    .container {
        width: 100%;
        padding: 20px;
    }

    header {
        flex-direction: column;
        align-items: stretch;
    }

    #logout {
        width: 100%;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .preview-area {
        min-height: 240px;
    }
}
</style>
</head>

<body>

<div class="container">
    <header>
        <h1>🎥 画面録画コントロールパネル</h1>
        <button id="logout">ログアウト</button>
    </header>

    <div class="layout">
        <section class="preview-area">
            <img class="preview-image" src="IMG_0312.jpeg" alt="操作画面イメージ" />
        </section>

        <section class="controls">
            <h2>操作項目</h2>

            <div id="status" class="status">
                操作画面です。下のボタンから各機能へ進みます。
            </div>

            <div class="group">
                <label for="storageType">保存先</label>
                <select id="storageType">
                    <option value="internal">内部ストレージ</option>
                    <option value="external">外部ストレージ（接続が確認できてるSSD、USB、SDカードなど）</option>
                </select>
            </div>

            <div class="group">
                <label for="fpsType">録画開始項目 / FPS</label>
                <select id="fpsType">
                    <option value="30">30FPS</option>
                    <option value="60">60FPS</option>
                </select>
            </div>

            <div class="group">
                <label for="resolutionType">解像度</label>
                <select id="resolutionType">
                    <option value="256x144">144p：256 × 144px</option>
                    <option value="427x240">240p：427 × 240px（低画質・モバイル向け）</option>
                    <option value="640x360">360p：640 × 360px（低画質）</option>
                    <option value="720x480">480p（SD）：720 × 480px（DVD相当）</option>
                    <option value="1280x720">720p（HD）：1280 × 720px（ハイビジョン）</option>
                    <option value="1920x1080">1080p（フルHD / 2K）：1920 × 1080px（現在の標準・YouTube等）</option>
                    <option value="2560x1440">1440p（WQHD / 2K）：2560 × 1440px（高解像度・ゲーム実況等）</option>
                </select>
            </div>

            <button id="to-save">保存先を作る</button>
            <button id="to-record">録画の画質を実行して録画する</button>

            <p class="info">
                この画面は操作用です。<br><br>
                「保存先を作る」は保存先設定ページへ移動します。<br>
                「録画の画質を実行して録画する」はFPSと解像度を選んで録画ページへ移動します。<br><br>
                保存前に容量が足りない場合は、
                「お使いのストレージは保存できるほどの容量を満たしておりません」
                を表示する構成にします。
            </p>
        </section>
    </div>
</div>

<script>
if (sessionStorage.getItem("recording_authenticated") !== "true") {
    window.location.href = "index.html";
}

const logout = document.getElementById("logout");
const status = document.getElementById("status");
const toSave = document.getElementById("to-save");
const toRecord = document.getElementById("to-record");
const storageType = document.getElementById("storageType");
const fpsType = document.getElementById("fpsType");
const resolutionType = document.getElementById("resolutionType");

toSave.addEventListener("click", () => {
    sessionStorage.setItem("selected_storage", storageType.value);
    window.location.href = "save.html";
});

toRecord.addEventListener("click", () => {
    sessionStorage.setItem("selected_storage", storageType.value);
    sessionStorage.setItem("selected_fps", fpsType.value);
    sessionStorage.setItem("selected_resolution", resolutionType.value);
    window.location.href = "record.html";
});

logout.addEventListener("click", () => {
    sessionStorage.removeItem("recording_authenticated");
    window.location.href = "index.html";
});
</script>

</body>
</html>
